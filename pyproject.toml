[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flexray"
version = "1.0.2"
description = "FleXray inference, training, dataset, model, and DRR structures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "FleXray contributors" }
]
keywords = [
  "deep-learning",
  "drr",
  "medical-imaging",
  "pytorch",
  "segmentation",
  "x-ray",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "huggingface_hub>=0.24",
  "numpy>=1.23",
  "Pillow>=10",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "scipy>=1.10",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
]

[project.urls]
Homepage = "https://flexray.csail.mit.edu/"
Documentation = "https://github.com/VictorButoi/FleXray/tree/main/docs"
Repository = "https://github.com/VictorButoi/FleXray"
Issues = "https://github.com/VictorButoi/FleXray/issues"

[project.scripts]
flexify = "fxr.inference.cli:main"
fxr-dataset = "fxr.datasets.cli:main"
fxr-train = "fxr.launch.cli:main"
fxr-submit = "fxr.launch.submit_cli:main"
fxr-render = "fxr.launch.render_cli:main"
fxr-protocol = "fxr.protocols.cli:main"
fxr-mcp = "fxr.mcp.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.optional-dependencies]
train = [
  "kornia>=0.8.2",
  "nanodrr>=0.1.5",
  "nibabel>=5",
  "pandas>=2,<3",
  "pydantic>=2",
  "submitit>=1.5",
  "tabulate>=0.9",
  "thunderpack>=0.0.1",
  "wandb>=0.16",
  "zstd!=1.5.7.3",
]
mcp = [
  "mcp>=1.10,<2",
]
dicom = [
  "pydicom>=2.4",
]
full = [
  "kornia>=0.8.2",
  "mcp>=1.10,<2",
  "nanodrr>=0.1.5",
  "nibabel>=5",
  "pandas>=2,<3",
  "pydantic>=2",
  "pydicom>=2.4",
  "submitit>=1.5",
  "tabulate>=0.9",
  "thunderpack>=0.0.1",
  "wandb>=0.16",
  "zstd!=1.5.7.3",
]
test = [
  "mcp>=1.10,<2",
  "nibabel>=5",
  "pydicom>=2.4",
  "pytest>=8",
  "thunderpack>=0.0.1",
  "zstd!=1.5.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fxr.configs" = [
  "cluster/*.yml",
  "cluster/*.yaml",
  "protocols/*.yml",
  "protocols/*.yaml",
  "models/*.yml",
  "models/*.yaml",
  "datasets/*.yml",
  "datasets/*.yaml",
  "dataset_layouts/*.yml",
  "dataset_layouts/*.yaml",
  "eval_contracts/*.yml",
  "eval_contracts/*.yaml",
  "colormaps/*.yml",
  "colormaps/*.yaml",
  "augmentations/*.yml",
  "augmentations/*.yaml",
  "training/*.yml",
  "training/*.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
